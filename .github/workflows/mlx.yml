name: MLX Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/mlx/**'
      - 'scripts/build-mlx-worker.sh'
      - 'cmd/swarm-local/**'
      - 'cmd/swarm-net/**'
      - 'cmd/swarmd/**'
      - 'internal/workerproc/**'
      - 'go.mod'
      - '.github/workflows/mlx.yml'
  pull_request:
    paths:
      - 'worker/mlx/**'
      - 'scripts/build-mlx-worker.sh'
      - 'cmd/swarm-local/**'
      - 'cmd/swarm-net/**'
      - 'cmd/swarmd/**'
      - 'internal/workerproc/**'
      - 'go.mod'
      - '.github/workflows/mlx.yml'

concurrency:
  group: mlx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mlx-worker-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift --version
      - name: Build MLX worker and Metal library
        run: ./scripts/build-mlx-worker.sh
      - name: Smoke test MLX worker
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          "$worker" health
          "$worker" capabilities
          "$worker" shard-smoke
      - name: Relay shard across two worker processes with Go
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          go run ./cmd/swarm-local -worker "$worker"
      - name: Relay shard over loopback swarm network
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          MLX_SWARM_WORKER="$worker" SWARMD_ADDR=127.0.0.1:18080 go run ./cmd/swarmd >"$RUNNER_TEMP/swarmd.log" 2>&1 &
          swarmd_pid=$!
          trap 'kill "$swarmd_pid" 2>/dev/null || true' EXIT

          ready=0
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/swarmd.log"
            exit 1
          fi

          go run ./cmd/swarm-net -worker "$worker" -peer http://127.0.0.1:18080
