name: MLX Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/mlx/**'
      - 'scripts/build-mlx-worker.sh'
      - 'cmd/swarm-local/**'
      - 'cmd/swarm-net/**'
      - 'cmd/swarmd/**'
      - 'internal/workerproc/**'
      - 'go.mod'
      - '.github/workflows/mlx.yml'
  pull_request:
    paths:
      - 'worker/mlx/**'
      - 'scripts/build-mlx-worker.sh'
      - 'cmd/swarm-local/**'
      - 'cmd/swarm-net/**'
      - 'cmd/swarmd/**'
      - 'internal/workerproc/**'
      - 'go.mod'
      - '.github/workflows/mlx.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: mlx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fork PRs do not receive repository secrets. Keep a local MLX compiler and
  # correctness check for those contributions without attaching them to the
  # private tailnet.
  mlx-worker-macos-fork:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift --version
      - name: Build MLX worker and Metal library
        run: ./scripts/build-mlx-worker.sh
      - name: Smoke test MLX worker
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          "$worker" health
          "$worker" capabilities
          "$worker" shard-smoke
          "$worker" checkpoint-shard-smoke
      - name: Relay shard across two worker processes with Go
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          go run ./cmd/swarm-local -worker "$worker"

  mlx-receiver-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Resolve/build before Tailscale modifies the macOS DNS resolver. SwiftPM
      # needs ordinary github.com DNS while fetching mlx-swift-lm.
      - name: Build MLX worker and Metal library
        run: ./scripts/build-mlx-worker.sh
      - name: Cache and verify the real checkpoint before Tailscale changes DNS
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          "$worker" checkpoint-shard-smoke
      - name: Connect receiver to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: mlx-swarm-r-${{ github.run_id }}
      - name: Start one-shot shard receiver
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          ts_ip="$(tailscale ip -4 | head -n 1)"
          if [ -z "$ts_ip" ]; then
            echo "Tailscale did not assign an IPv4 address" >&2
            exit 1
          fi
          echo "receiver_tailscale_ip=$ts_ip"
          MLX_SWARM_WORKER="$worker" \
            SWARMD_ADDR="${ts_ip}:8080" \
            SWARMD_EXIT_AFTER_DEBUG_SHARD=1 \
            go run ./cmd/swarmd

  mlx-producer-macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: swift --version
      # Keep all dependency resolution and local correctness work off the
      # Tailscale-modified resolver; attach to the tailnet only for WAN relay.
      - name: Build MLX worker and Metal library
        run: ./scripts/build-mlx-worker.sh
      - name: Smoke test MLX worker
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          "$worker" health
          "$worker" capabilities
          "$worker" shard-smoke
          "$worker" checkpoint-shard-smoke
      - name: Relay shard across two local worker processes with Go
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          go run ./cmd/swarm-local -worker "$worker"
      - name: Connect producer to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          hostname: mlx-swarm-p-${{ github.run_id }}
      - name: Discover receiver and relay shard across runners
        run: |
          worker="$GITHUB_WORKSPACE/worker/mlx/.build/xcode/Build/Products/Debug/MLXWorker"
          peer_name="mlx-swarm-r-${GITHUB_RUN_ID}"
          peer_ip=""

          for _ in {1..120}; do
            peer_ip="$(tailscale status --json | jq -r --arg name "$peer_name" '(.Peer // {})[] | select(.HostName == $name) | .TailscaleIPs[]? | select(contains(":") | not)' | head -n 1)"
            if [ -n "$peer_ip" ]; then
              break
            fi
            sleep 2
          done

          if [ -z "$peer_ip" ]; then
            echo "Could not discover Tailscale peer $peer_name" >&2
            tailscale status
            exit 1
          fi

          echo "receiver_tailscale_ip=$peer_ip"
          ping_output="$(tailscale ping --timeout=10s "$peer_ip" 2>&1 || true)"
          printf '%s\n' "$ping_output"
          route_line="$(printf '%s\n' "$ping_output" | grep '^pong from ' | tail -n 1 || true)"
          route="$(printf '%s\n' "$route_line" | sed -E 's/^.* via (.*) in [^ ]+$/\1/')"
          if [ -z "$route" ]; then
            route="unknown"
          fi

          ready=0
          for _ in {1..120}; do
            if curl -fsS --connect-timeout 2 "http://${peer_ip}:8080/healthz" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Receiver was discovered but never became HTTP-ready" >&2
            tailscale status
            exit 1
          fi

          network_json="$(go run ./cmd/swarm-net \
            -worker "$worker" \
            -peer "http://${peer_ip}:8080")"
          printf '%s\n' "$network_json"

          if [ "$(printf '%s' "$network_json" | jq -r '.matchesFullCheckpoint')" != "true" ]; then
            echo "Distributed final logits did not match the full checkpoint" >&2
            exit 1
          fi
          if [ "$(printf '%s' "$network_json" | jq -r '.passesMemoryProof')" != "true" ]; then
            echo "Distributed workers did not pass the configured memory proof" >&2
            exit 1
          fi

          {
            echo "## MLX Swarm distributed benchmark"
            echo
            echo "Two independent GitHub-hosted macOS runners, connected through Tailscale."
            echo
            echo "| Metric | Value |"
            echo "|---|---:|"
            printf '| Model | `%s` |\n' "$(printf '%s' "$network_json" | jq -r '.model')"
            printf '| Adapter model type | `%s` |\n' "$(printf '%s' "$network_json" | jq -r '.modelType')"
            printf '| Layers | %s (split at %s) |\n' "$(printf '%s' "$network_json" | jq -r '.layers')" "$(printf '%s' "$network_json" | jq -r '.splitLayer')"
            printf '| Boundary dtype | `%s` |\n' "$(printf '%s' "$network_json" | jq -r '.boundaryDType')"
            printf '| Output shape | `%s` |\n' "$(printf '%s' "$network_json" | jq -c '.outputShape')"
            printf '| Tensor bytes | %s |\n' "$(printf '%s' "$network_json" | jq -r '.boundaryTensorBytes')"
            printf '| Wire bytes | %s |\n' "$(printf '%s' "$network_json" | jq -r '.boundaryWireBytes')"
            printf '| Worker budget | %.2f MiB |\n' "$(printf '%s' "$network_json" | jq -r '.workerBudgetBytes / 1048576')"
            printf '| Full checkpoint peak | %.2f MiB |\n' "$(printf '%s' "$network_json" | jq -r '.fullCheckpointPeakBytes / 1048576')"
            printf '| Producer shard peak | %.2f MiB |\n' "$(printf '%s' "$network_json" | jq -r '.firstStagePeakBytes / 1048576')"
            printf '| Consumer shard peak | %.2f MiB |\n' "$(printf '%s' "$network_json" | jq -r '.secondStagePeakBytes / 1048576')"
            printf '| Producer | %.3f ms |\n' "$(printf '%s' "$network_json" | jq -r '.producerMillis')"
            printf '| Network round trip | %.3f ms |\n' "$(printf '%s' "$network_json" | jq -r '.networkMillis')"
            printf '| Remote worker | %.3f ms |\n' "$(printf '%s' "$network_json" | jq -r '.remoteWorkerMillis')"
            printf '| Transport overhead | %.3f ms |\n' "$(printf '%s' "$network_json" | jq -r '.transportOverheadMillis')"
            printf '| Total producer + remote | %.3f ms |\n' "$(printf '%s' "$network_json" | jq -r '.totalMillis')"
            printf '| Effective wire throughput | %.3f MB/s |\n' "$(printf '%s' "$network_json" | jq -r '.wireEffectiveMBps')"
            printf '| Tailscale route | `%s` |\n' "$route"
            printf '| Logit tolerance | `rtol=%s, atol=%s` |\n' "$(printf '%s' "$network_json" | jq -r '.rtol')" "$(printf '%s' "$network_json" | jq -r '.atol')"
            printf '| Final-logit correctness | **%s** |\n' "$(printf '%s' "$network_json" | jq -r 'if .matchesFullCheckpoint then "MATCH" else "MISMATCH" end')"
            printf '| Memory proof | **%s** |\n' "$(printf '%s' "$network_json" | jq -r 'if .passesMemoryProof then "PASS" else "FAIL" end')"
            echo
            echo "Route probe: \`$route_line\`"
          } >> "$GITHUB_STEP_SUMMARY"
