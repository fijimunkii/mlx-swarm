name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  mlx-worker-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - name: Build MLX worker
        working-directory: worker/mlx
        run: swift build
      - name: Smoke test MLX worker
        working-directory: worker/mlx
        run: swift run --skip-build MLXWorker health
