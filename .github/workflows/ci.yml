name: Go CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: go-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Record bounded worker-failure characterization
        id: failure-characterization
        run: |
          failure_path="$RUNNER_TEMP/mlx-swarm-failure-characterization.json"
          go run ./cmd/swarm-failure-smoke > "$failure_path"
          jq -e '
            .schemaVersion == "1" and
            .allTerminatedBounded and
            .allCleanupReleased and
            .allRecoveryReady and
            ([.scenarios[].name] | sort) == ["delay", "disconnect", "jitter", "kill", "pause"]
          ' "$failure_path" >/dev/null
          printf 'failure_path=%s\n' "$failure_path" >> "$GITHUB_OUTPUT"
          {
            echo '## Bounded worker-failure characterization'
            echo
            printf 'Per-forward deadline: %s ms; scenario bound: %s ms; failed-token rate: %.3f\n\n' \
              "$(jq -r '.forwardDeadlineMillis' "$failure_path")" \
              "$(jq -r '.scenarioBoundMillis' "$failure_path")" \
              "$(jq -r '.failedTokenRate' "$failure_path")"
            echo '| Scenario | Failure expected/observed | Termination | Restarts | Cleanup | Recovery |'
            echo '|---|---:|---:|---:|---:|---:|'
            jq -r '.scenarios[] | "| \(.name) | \(.expectedFailure)/\(.observedFailure) | \(.terminatedInMillis) ms | \(.workerRestarts) | \(.cleanupReleased) | \(.recoveryReady) |"' "$failure_path"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload worker-failure characterization
        uses: actions/upload-artifact@v4
        with:
          name: mlx-swarm-failure-characterization-${{ github.run_id }}
          path: ${{ steps.failure-characterization.outputs.failure_path }}
      - name: Prove synthetic mesh scale and churn
        id: mesh-stress
        run: |
          mesh_path="$RUNNER_TEMP/mlx-swarm-mesh-scale-churn.json"
          go run ./cmd/swarm-mesh-smoke > "$mesh_path"
          jq -e '
            .schemaVersion == 1 and
            .checks.allPassed and
            .bounds.workerCount >= 32 and
            .bounds.networkProbeCount <= .bounds.networkProbeLimit and
            ([.decisions[].visibleWorkerCount] | max) >= 32 and
            ([.decisions[].searchOperationCount] | max) <= .bounds.maxSearchOperations and
            ([.decisions[].decisionMicros] | max) <= .bounds.maxDecisionMicros
          ' "$mesh_path" >/dev/null
          printf 'mesh_path=%s\n' "$mesh_path" >> "$GITHUB_OUTPUT"
          {
            echo '## Synthetic mesh scale and churn'
            echo
            printf 'Visible workers: **%s**; membership requests: **%s**; active placement probes: **%s**\n\n' \
              "$(jq -r '.bounds.workerCount' "$mesh_path")" \
              "$(jq -r '.bounds.membershipRequestCount' "$mesh_path")" \
              "$(jq -r '.bounds.networkProbeCount' "$mesh_path")"
            echo '| Decision | Visible | Eligible | Search operations | Decision (μs) | Selected plan |'
            echo '|---|---:|---:|---:|---:|---|'
            jq -r '.decisions[] | "| \(.name) | \(.visibleWorkerCount) | \(.eligibleWorkerCount) | \(.searchOperationCount) | \(.decisionMicros) | `\(.planSignature)` |"' "$mesh_path"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload synthetic mesh evidence
        uses: actions/upload-artifact@v4
        with:
          name: mlx-swarm-mesh-scale-churn-${{ github.run_id }}
          path: ${{ steps.mesh-stress.outputs.mesh_path }}
